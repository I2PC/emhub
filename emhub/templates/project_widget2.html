      // ---------- Mount project page ----------
      function mountProjectPage(projectId) {
        var target = $(projectPageHostSel);
        if (!target) {
          console.error("[host] missing project page host");
          return;
        }

        function tryMount() {
          var api = window.MyProjectsWidget || window.ProjectPageWidget || window.MyWidgets;
          var mountFn =
            api && (api.mountProjectPageWidget || api.mountProjectPage || api.mountPage);
          if (!mountFn) {
            console.warn("[host] Project page widget not ready, retrying...");
            setTimeout(tryMount, 50);
            return;
          }

          try {
            if (currentProjectId !== projectId) {
              unmountList();
             // ensureDomRoots();
              showPageOnly();
            }

            var pageProps = {
              onOpenProtocol: function (protocolId) {
                openProtocolDetail(projectId, protocolId);
              },
              onProtocolOpen: function (protocolId) {
                openProtocolDetail(projectId, protocolId);
              },
            };

            if (currentProjectId !== projectId) {
              pageRoot = mountFn({
                container: target,
                service: svc,
                projectName: String(projectId),
                props: pageProps,
              });
              currentProjectId = String(projectId);
            }

            showPageOnly();
            console.log("[host] project page mounted:", projectId);
          } catch (err) {
            target.innerHTML =
              '<pre class="error">ProjectPageWidget error:\n' +
              String(err && (err.stack || err)) +
              "</pre>";
            console.error(err);
          }
        }

        tryMount();
      }

      // ---------- Protocol detail ----------
      function closeDetailPanel() {
        unmountDetail();
        showPageOnly();
        try {
          var proj = currentProjectId || "";
          history.pushState(null, "", "/project/load/" + encodeURIComponent(proj));
        } catch (e) {}
      }

      function openProtocolDetail(projectId, protocolId, prefetchedDetail) {
       // ensureDomRoots();

        var api = null;
        if (window.MyProjectsWidget && window.MyProjectsWidget.mountProtocolDetailWidget) {
          api = { mountProtocolDetailWidget: window.MyProjectsWidget.mountProtocolDetailWidget };
        } else if (window.ProtocolDetailWidget) {
          api = window.ProtocolDetailWidget;
        }

        var target = $(protocolDetailHostSel);
        if (!api || !api.mountProtocolDetailWidget) {
          console.warn("[host] ProtocolDetailWidget is not ready yet. Retrying...");
          setTimeout(function () {
            openProtocolDetail(projectId, protocolId, prefetchedDetail);
          }, 60);
          return;
        }
        if (!target) {
          console.error("[host] missing protocol detail host");
          return;
        }

        var key = String(projectId) + ":" + String(protocolId);
        if (currentDetailKey === key && detailRoot) {
          showPageWithDetail();
          return;
        }

        unmountDetail();
        showPageWithDetail();

        try {
          detailRoot = api.mountProtocolDetailWidget({
            container: target,
            service: svc,
            projectId: String(projectId),
            protocolId: String(protocolId),
            props: {
              initialProtocol: prefetchedDetail,
              onClose: closeDetailPanel,
              variant: "docked",
            },
          });

          currentDetailKey = key;
          try {
            history.pushState(null, "", "/project/" +  encodeURIComponent(projectId) + "/protocol/" + encodeURIComponent(protocolId));
          } catch (e) {}
          console.log("[host] protocol detail mounted:", key);
        } catch (err) {
          target.innerHTML = '<pre class="error">ProtocolDetailWidget error:\n' + String(err && (err.stack || err)) +  "</pre>";
          console.error(err);
        }
      }
