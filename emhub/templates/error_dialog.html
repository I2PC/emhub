<!-- ============================================================== -->
<!-- Error Modal Content -->
<!-- ============================================================== -->
  <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="error-modal-title" style="color: red">ERROR:</h3>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
          <h3> {{ error['message'] }} </h3>


          {% if error['body'] %}

            <div class="col-col-12">

                <div class="accordion-regular">
                    <div id="accordionError">

                        <div class="card">
                            <div class="card-header" id="headingError">
                                <h5 class="mb-0">
                                <button class="btn btn-link" data-toggle="collapse" data-target="#collapseError" aria-expanded="false" aria-controls="collapseError">
                                <span class="fas fa-angle-down mr-3"></span>Display error traceback
                                </button>
                                </h5>
                            </div>

                            <div id="collapseError" class="collapse" aria-labelledby="headingError" data-parent="#accordionError">
                                <div class="card-body">
                                    <pre>{{ error['body'] }}</pre>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
          {% endif %}

      </div>
    </div>
  </div>
<!-- ============================================================== -->
<!-- End of Error Modal Content -->
<!-- ============================================================== -->
