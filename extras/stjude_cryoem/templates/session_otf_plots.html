{% import "entry_macros.html" as macros %}

<div class="col-12">
<div class="card"> <!-- Data Card -->
            <div class="card-header">
                <h3 class="card-header-title"> Average time (seconds) per step </h3>
            </div>

            <div class="card-body">
                <table class="table table-striped table-bordered col-1">
                    <tbody>
                        {% for k, v in means.items() %}
                            {{ macros.trow(k, v, 'h4') }}
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div> <!-- End of Data Card -->
        <div class="card"> <!-- Data Card -->
            <div class="card-header">
                <h3 class="card-header-title"> Batch processing time </h3>
            </div>

            <div class="card-body">
                <div id="otf-plot" class="col-12" style="min-height: 600px;"></div>
            </div>
        </div> <!-- End of Data Card -->
    </div>

<script>

    var batches = {{batches|tojson}};
    var series = {{ series|tojson }};


function createOtfPlots() {
    Highcharts.chart('otf-plot', {
        chart: {
            type: 'column'
        },
        /**title: {
            text: 'Preprocessing batch times',
            align: 'left'
        },**/
        xAxis: {
            categories: batches //['Arsenal', 'Chelsea', 'Liverpool', 'Manchester United']
        },
        yAxis: {
            min: 0,
            title: {
                text: 'Count trophies'
            },
            stackLabels: {
                enabled: true
            }
        },
        legend: {
            align: 'left',
            x: 70,
            verticalAlign: 'top',
            y: 70,
            floating: true,
            backgroundColor:
                Highcharts.defaultOptions.legend.backgroundColor || 'white',
            borderColor: '#CCC',
            borderWidth: 1,
            shadow: false
        },
        tooltip: {
            headerFormat: '<b>{category}</b><br/>',
            pointFormat: '{series.name}: {point.y}<br/>Total: {point.stackTotal}'
        },
        plotOptions: {
            column: {
                stacking: 'normal',
                dataLabels: {
                    enabled: true
                }
            }
        },
        series: series
         /**
            [{
            name: 'BPL',
            data: [3, 5, 1, 13]
        }, {
            name: 'FA Cup',
            data: [14, 8, 8, 12]
        }, {
            name: 'CL',
            data: [0, 2, 6, 3]
        }] **/
    });
}

(function(window, document, $, undefined) {
    "use strict";
    $(function() {
        createOtfPlots();
    });
})(window, document, window.jQuery);

</script>
